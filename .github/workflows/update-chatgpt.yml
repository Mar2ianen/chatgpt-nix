name: Update ChatGPT package

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-chatgpt
  cancel-in-progress: false

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  UPDATE_BRANCH: automation/update-chatgpt

jobs:
  update:
    name: Update, validate and merge ChatGPT package
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Download upstream DEB and read metadata
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          deb="$RUNNER_TEMP/chatgpt_amd64.deb"
          package_url=$(awk -F'"' '/^[[:space:]]*url = "https:/{print $2; exit}' package.nix)
          test -n "$package_url"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$deb" "$package_url"
          version=$(nix shell nixpkgs#dpkg --command dpkg-deb --field "$deb" Version)
          sha256=$(sha256sum "$deb" | awk '{print $1}')
          hash=$(nix hash file --type sha256 --base64 "$deb")
          {
            echo "version=$version"
            echo "sha256=$sha256"
            echo "hash=sha256-$hash"
            echo "url=$package_url"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream version: $version"
          echo "Source URL: $package_url"
          echo "SHA-256: $sha256"
          echo "Nix hash: sha256-$hash"

      - name: Check whether main needs an update
        id: changed
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_HASH: ${{ steps.upstream.outputs.hash }}
        shell: bash
        run: |
          set -euo pipefail
          current_version=$(awk -F'"' '/^[[:space:]]*version = /{print $2; exit}' package.nix)
          current_hash=$(awk -F'"' '/^[[:space:]]*hash = /{print $2; exit}' package.nix)
          if [ "$current_version" = "$UPSTREAM_VERSION" ] && [ "$current_hash" = "$UPSTREAM_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main already points at upstream $UPSTREAM_VERSION."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "main is $current_version/$current_hash; upstream is $UPSTREAM_VERSION/$UPSTREAM_HASH."
          fi

      - name: Close obsolete update PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r number head; do
            [ -n "$number" ] || continue
            case "$head" in
              automation/update-chatgpt)
                continue
                ;;
              automation/update-chatgpt-*)
                echo "Closing obsolete update PR #$number ($head)."
                gh pr close "$number" --repo "$GITHUB_REPOSITORY" \
                  --comment "Superseded by the single rolling ChatGPT update PR." || true
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/git/refs/heads/$head" || true
                ;;
            esac
          done < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | [.number, .headRefName] | @tsv')

      - name: Close stale rolling PR when main is current
        if: steps.changed.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$UPDATE_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Main already contains the latest upstream package." || true
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/$UPDATE_BRANCH" || true
          fi

      - name: Update, validate and publish rolling branch
        if: steps.changed.outputs.changed == 'true'
        id: publish
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_SHA256: ${{ steps.upstream.outputs.sha256 }}
          UPSTREAM_HASH: ${{ steps.upstream.outputs.hash }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$UPDATE_BRANCH"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
          else
            git switch -c "$branch"
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          package = Path("package.nix")
          text = package.read_text()
          text, version_count = re.subn(
              r'(?m)^(  version = )"[^"]+";',
              rf'\1"{os.environ["UPSTREAM_VERSION"]}";',
              text,
              count=1,
          )
          text, hash_count = re.subn(
              r'(?m)^(    hash = )"[^"]+";',
              rf'\1"{os.environ["UPSTREAM_HASH"]}";',
              text,
              count=1,
          )
          if version_count != 1 or hash_count != 1:
              raise SystemExit("package.nix metadata layout changed")
          package.write_text(text)

          readme = Path("README.md")
          text = readme.read_text()
          text, version_count = re.subn(
              r'(?m)^- version: `[^`]+`$',
              f'- version: `{os.environ["UPSTREAM_VERSION"]}`',
              text,
              count=1,
          )
          text, hash_count = re.subn(
              r'(?m)^- SHA-256: `[^`]+`$',
              f'- SHA-256: `{os.environ["UPSTREAM_SHA256"]}`',
              text,
              count=1,
          )
          if version_count != 1 or hash_count != 1:
              raise SystemExit("README metadata layout changed")
          readme.write_text(text)
          PY

          nix flake check --all-systems
          nix build .#default
          nix build .#checks.x86_64-linux.package-contract --no-link

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.nix README.md; then
            git add package.nix README.md
            git commit -m "Update ChatGPT to $UPSTREAM_VERSION"
            git push --set-upstream origin "$branch"
          else
            echo "Rolling update branch already has $UPSTREAM_VERSION."
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create and merge rolling update PR
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ steps.publish.outputs.branch }}"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$branch" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "Update ChatGPT to $UPSTREAM_VERSION" \
              --body "Automated update from the upstream DEB. The workflow calculated the SHA-256 and Nix SRI hash, built the package, and ran the package contract before merging.")
            number=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" \
              --json number --jq '.number')
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" \
            --squash --delete-branch \
            --subject "Update ChatGPT to $UPSTREAM_VERSION" \
            --body "Validated automatic upstream package update."
          echo "Merged PR #$number."

      - name: Dispatch post-merge build and release
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          for workflow in nix-build.yml release.yml; do
            found=0
            for _ in 1 2 3 4 5; do
              if [ "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --branch main --commit "$main_sha" --json databaseId --jq 'length')" -gt 0 ]; then
                found=1
                break
              fi
              sleep 3
            done
            if [ "$found" -eq 0 ]; then
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
            fi
          done
